<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="tBpm dBpm">
  <title id="tBpm">Proceso de cotización en notación BPMN simplificada</title>
  <desc id="dBpm">Dos carriles: Cliente y Ventas. El cliente pide una cotización. Ventas revisa los requisitos. Si faltan datos, se piden al cliente y se vuelve a revisar. Si están completos, se prepara la propuesta, se envía la cotización y el proceso termina.</desc>
  <defs>
    <marker id="arBpm" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b1b4d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" rx="12" fill="#ffffff"/>

  <rect x="20" y="50" width="860" height="150" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <text x="34" y="82" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Cliente</text>
  <rect x="20" y="210" width="860" height="190" fill="#ffffff" stroke="#0b1b4d" stroke-width="2"/>
  <text x="34" y="242" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Ventas</text>

  <circle cx="120" cy="120" r="18" fill="#ffffff" stroke="#0b1b4d" stroke-width="2"/>
  <text x="134" y="170" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Pide cotización</text>

  <rect x="340" y="80" width="140" height="60" rx="12" fill="#38a9f5"/>
  <text x="410" y="105" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Pedir datos</text>
  <text x="410" y="127" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">al cliente</text>

  <rect x="190" y="270" width="130" height="60" rx="12" fill="#2563eb"/>
  <text x="255" y="295" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffffff">Revisar</text>
  <text x="255" y="317" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffffff">requisitos</text>

  <path d="M380,270 L380,140" stroke="#0b1b4d" stroke-width="2" fill="none" marker-end="url(#arBpm)"/>
  <text x="392" y="238" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">No</text>

  <polygon points="380,270 410,300 380,330 350,300" fill="#f5a524" stroke="#0b1b4d" stroke-width="2"/>
  <text x="380" y="358" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">¿Completo?</text>

  <rect x="440" y="270" width="140" height="60" rx="12" fill="#2563eb"/>
  <text x="510" y="295" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffffff">Preparar</text>
  <text x="510" y="317" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffffff">propuesta</text>

  <rect x="630" y="270" width="130" height="60" rx="12" fill="#2563eb"/>
  <text x="695" y="295" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffffff">Enviar</text>
  <text x="695" y="317" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffffff">cotización</text>

  <circle cx="830" cy="300" r="18" fill="#ffffff" stroke="#0b1b4d" stroke-width="4"/>
  <text x="830" y="346" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Fin</text>

  <path d="M120,138 L120,300 L186,300" stroke="#0b1b4d" stroke-width="2" fill="none" marker-end="url(#arBpm)"/>
  <path d="M320,300 L346,300" stroke="#0b1b4d" stroke-width="2" fill="none" marker-end="url(#arBpm)"/>
  <path d="M410,300 L436,300" stroke="#0b1b4d" stroke-width="2" fill="none" marker-end="url(#arBpm)"/>
  <text x="422" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Sí</text>
  <path d="M580,300 L626,300" stroke="#0b1b4d" stroke-width="2" fill="none" marker-end="url(#arBpm)"/>
  <path d="M760,300 L808,300" stroke="#0b1b4d" stroke-width="2" fill="none" marker-end="url(#arBpm)"/>
  <path d="M340,110 L255,110 L255,266" stroke="#0b1b4d" stroke-width="2" fill="none" marker-end="url(#arBpm)"/>
</svg>
