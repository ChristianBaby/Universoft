<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b1b4d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" fill="#ffffff"/>
  <!-- Etapas -->
  <rect x="30" y="150" width="180" height="110" rx="12" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <text x="120" y="195" text-anchor="middle" font-size="19" font-weight="700" fill="#0b1b4d">Monolito</text>
  <text x="120" y="228" text-anchor="middle" font-size="16" fill="#0b1b4d">Inicio simple</text>

  <rect x="240" y="150" width="180" height="110" rx="12" fill="#f3f6fb" stroke="#2563eb" stroke-width="2"/>
  <text x="330" y="195" text-anchor="middle" font-size="19" font-weight="700" fill="#0b1b4d">Monolito modular</text>
  <text x="330" y="228" text-anchor="middle" font-size="16" fill="#0b1b4d">Límites claros</text>

  <rect x="450" y="150" width="180" height="110" rx="12" fill="#38a9f5" stroke="#38a9f5" stroke-width="2"/>
  <text x="540" y="195" text-anchor="middle" font-size="19" font-weight="700" fill="#0b1b4d">Primer servicio</text>
  <text x="540" y="228" text-anchor="middle" font-size="16" fill="#0b1b4d">Módulo que escala</text>

  <rect x="660" y="150" width="200" height="110" rx="12" fill="#2563eb"/>
  <text x="760" y="195" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Varios servicios</text>
  <text x="760" y="228" text-anchor="middle" font-size="16" fill="#ffffff">Equipos y operación listos</text>

  <!-- Flechas -->
  <line x1="212" y1="205" x2="236" y2="205" stroke="#0b1b4d" stroke-width="3" marker-end="url(#flecha)"/>
  <line x1="422" y1="205" x2="446" y2="205" stroke="#0b1b4d" stroke-width="3" marker-end="url(#flecha)"/>
  <line x1="632" y1="205" x2="656" y2="205" stroke="#0b1b4d" stroke-width="3" marker-end="url(#flecha)"/>

  <!-- Pie -->
  <text x="450" y="330" text-anchor="middle" font-size="18" fill="#0b1b4d">Avanza a la siguiente etapa solo cuando el problema aparezca</text>
  <text x="450" y="365" text-anchor="middle" font-size="16" fill="#0b1b4d">Un paso a la vez, sin reescribir todo el sistema de golpe</text>
</svg>
