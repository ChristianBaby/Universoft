<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="tSprint dSprint">
  <title id="tSprint">Ciclo de un Sprint en Scrum</title>
  <desc id="dSprint">Cuatro cajas en círculo: planificación del Sprint, Daily Scrum, revisión del Sprint y retrospectiva, unidas por flechas en orden. En el centro se indica que el Sprint dura un mes o menos.</desc>
  <defs>
    <marker id="flechaSprint" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" rx="12" fill="#ffffff"/>
  <text x="40" y="45" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b1b4d">Ciclo de un Sprint</text>

  <rect x="115" y="90" width="230" height="60" rx="12" fill="#f3f6fb" stroke="#2563eb" stroke-width="2"/>
  <text x="230" y="126" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b1b4d">Planificación del Sprint</text>

  <rect x="555" y="90" width="230" height="60" rx="12" fill="#f3f6fb" stroke="#2563eb" stroke-width="2"/>
  <text x="670" y="126" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b1b4d">Daily Scrum</text>

  <rect x="555" y="300" width="230" height="60" rx="12" fill="#f3f6fb" stroke="#2563eb" stroke-width="2"/>
  <text x="670" y="336" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b1b4d">Revisión del Sprint</text>

  <rect x="115" y="300" width="230" height="60" rx="12" fill="#f3f6fb" stroke="#2563eb" stroke-width="2"/>
  <text x="230" y="336" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b1b4d">Retrospectiva</text>

  <circle cx="450" cy="225" r="85" fill="#0b1b4d"/>
  <text x="450" y="218" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Sprint</text>
  <text x="450" y="244" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffffff">Un mes o menos</text>

  <line x1="347" y1="120" x2="551" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#flechaSprint)"/>
  <line x1="670" y1="152" x2="670" y2="296" stroke="#2563eb" stroke-width="2" marker-end="url(#flechaSprint)"/>
  <line x1="551" y1="330" x2="347" y2="330" stroke="#2563eb" stroke-width="2" marker-end="url(#flechaSprint)"/>
  <line x1="230" y1="296" x2="230" y2="154" stroke="#f5a524" stroke-width="3" marker-end="url(#flechaSprint)"/>

  <text x="40" y="415" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Cada Sprint termina con un incremento utilizable del producto.</text>
</svg>
