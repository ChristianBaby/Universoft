<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="t2 d2">
  <title id="t2">Seguridad perimetral frente a Zero Trust</title>
  <desc id="d2">Dos paneles. A la izquierda, la seguridad perimetral: un firewall protege el borde y todo lo interno es confiable. A la derecha, Zero Trust: una política revisa cada acceso a cada recurso, sin confianza por ubicación.</desc>
  <rect x="0" y="0" width="900" height="450" fill="#ffffff"/>

  <!-- Panel izquierdo: perimetral -->
  <rect x="20" y="20" width="420" height="410" rx="12" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <text x="230" y="62" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0b1b4d">Seguridad perimetral</text>
  <!-- Red interna con muro -->
  <rect x="60" y="90" width="340" height="230" rx="12" fill="#ffffff" stroke="#0b1b4d" stroke-width="2"/>
  <rect x="50" y="84" width="360" height="12" rx="4" fill="#0b1b4d"/>
  <text x="230" y="78" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Firewall en el borde</text>
  <rect x="90" y="140" width="110" height="60" rx="10" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <text x="145" y="176" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Servidor</text>
  <rect x="260" y="140" width="110" height="60" rx="10" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <text x="315" y="176" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Base de datos</text>
  <rect x="175" y="240" width="110" height="60" rx="10" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <text x="230" y="276" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Equipos</text>
  <text x="230" y="354" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold" fill="#0b1b4d">Dentro: confianza total</text>
  <text x="230" y="382" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Un intruso adentro se mueve libre</text>

  <!-- Panel derecho: Zero Trust -->
  <rect x="460" y="20" width="420" height="410" rx="12" fill="#f3f6fb" stroke="#2563eb" stroke-width="3"/>
  <text x="670" y="62" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0b1b4d">Zero Trust</text>
  <rect x="560" y="82" width="220" height="50" rx="10" fill="#2563eb"/>
  <text x="670" y="113" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Política por acceso</text>
  <line x1="670" y1="132" x2="530" y2="200" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha2)"/>
  <line x1="670" y1="132" x2="670" y2="200" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha2)"/>
  <line x1="670" y1="132" x2="810" y2="200" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha2)"/>
  <rect x="480" y="200" width="100" height="70" rx="10" fill="#ffffff" stroke="#0b1b4d" stroke-width="2"/>
  <text x="530" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Servidor</text>
  <text x="530" y="256" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#2563eb" font-weight="bold">verifica</text>
  <rect x="620" y="200" width="100" height="70" rx="10" fill="#ffffff" stroke="#0b1b4d" stroke-width="2"/>
  <text x="670" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Base de datos</text>
  <text x="670" y="256" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#2563eb" font-weight="bold">verifica</text>
  <rect x="750" y="200" width="100" height="70" rx="10" fill="#ffffff" stroke="#0b1b4d" stroke-width="2"/>
  <text x="800" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Equipos</text>
  <text x="800" y="256" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#2563eb" font-weight="bold">verifica</text>
  <text x="670" y="354" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold" fill="#0b1b4d">Cada acceso se verifica</text>
  <text x="670" y="382" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Ubicación no otorga confianza</text>

  <defs>
    <marker id="flecha2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b1b4d"/>
    </marker>
  </defs>
</svg>
