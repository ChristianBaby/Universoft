<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b1b4d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" fill="#ffffff"/>
  <!-- Titulos -->
  <text x="220" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#0b1b4d">Monolito</text>
  <text x="680" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#0b1b4d">Microservicios</text>
  <!-- Monolito -->
  <rect x="60" y="75" width="320" height="300" rx="12" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <rect x="85" y="110" width="270" height="220" rx="12" fill="#2563eb"/>
  <rect x="105" y="130" width="110" height="70" rx="8" fill="#ffffff"/>
  <text x="160" y="172" text-anchor="middle" font-size="16" fill="#0b1b4d">Ventas</text>
  <rect x="225" y="130" width="110" height="70" rx="8" fill="#ffffff"/>
  <text x="280" y="172" text-anchor="middle" font-size="16" fill="#0b1b4d">Reservas</text>
  <rect x="105" y="220" width="110" height="70" rx="8" fill="#ffffff"/>
  <text x="160" y="262" text-anchor="middle" font-size="16" fill="#0b1b4d">Facturas</text>
  <rect x="225" y="220" width="110" height="70" rx="8" fill="#ffffff"/>
  <text x="280" y="262" text-anchor="middle" font-size="16" fill="#0b1b4d">Clientes</text>
  <text x="220" y="350" text-anchor="middle" font-size="18" fill="#0b1b4d">Un solo despliegue</text>
  <!-- Microservicios -->
  <rect x="500" y="75" width="360" height="300" rx="12" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <rect x="600" y="95" width="160" height="50" rx="10" fill="#0b1b4d"/>
  <text x="680" y="127" text-anchor="middle" font-size="16" fill="#ffffff">API gateway</text>
  <line x1="680" y1="145" x2="570" y2="185" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="680" y1="145" x2="680" y2="185" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="680" y1="145" x2="790" y2="185" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>
  <rect x="520" y="190" width="100" height="60" rx="10" fill="#38a9f5"/>
  <text x="570" y="226" text-anchor="middle" font-size="16" fill="#0b1b4d">Ventas</text>
  <rect x="630" y="190" width="100" height="60" rx="10" fill="#38a9f5"/>
  <text x="680" y="226" text-anchor="middle" font-size="16" fill="#0b1b4d">Reservas</text>
  <rect x="740" y="190" width="100" height="60" rx="10" fill="#38a9f5"/>
  <text x="790" y="226" text-anchor="middle" font-size="16" fill="#0b1b4d">Facturas</text>
  <ellipse cx="570" cy="300" rx="38" ry="14" fill="#f5a524"/>
  <ellipse cx="680" cy="300" rx="38" ry="14" fill="#f5a524"/>
  <ellipse cx="790" cy="300" rx="38" ry="14" fill="#f5a524"/>
  <line x1="570" y1="250" x2="570" y2="286" stroke="#0b1b4d" stroke-width="2"/>
  <line x1="680" y1="250" x2="680" y2="286" stroke="#0b1b4d" stroke-width="2"/>
  <line x1="790" y1="250" x2="790" y2="286" stroke="#0b1b4d" stroke-width="2"/>
  <text x="680" y="350" text-anchor="middle" font-size="18" fill="#0b1b4d">Cada servicio, su despliegue</text>
  <!-- Separador -->
  <line x1="450" y1="90" x2="450" y2="360" stroke="#0b1b4d" stroke-width="1" stroke-dasharray="6 6"/>
</svg>
