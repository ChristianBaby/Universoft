<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="tCiclo dCiclo">
  <title id="tCiclo">Ciclo de mejora continua con métricas DORA</title>
  <desc id="dCiclo">Cuatro pasos en círculo: cambiar código, probar y desplegar, medir con DORA y mejorar el proceso. El ciclo se repite y cada medición alimenta la siguiente mejora.</desc>
  <defs>
    <marker id="flechaCiclo" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" rx="12" fill="#ffffff"/>
  <text x="40" y="40" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#0b1b4d">Ciclo de mejora con métricas DORA</text>

  <g stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#flechaCiclo)">
    <path d="M 550 98 Q 710 98 710 195"/>
    <path d="M 710 255 Q 710 352 552 352"/>
    <path d="M 348 352 Q 190 352 190 255"/>
    <path d="M 190 195 Q 190 98 348 98"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="350" y="70" width="200" height="56" rx="12" fill="#2563eb"/>
    <text x="450" y="104" fill="#ffffff">Cambiar código</text>
    <rect x="610" y="197" width="200" height="56" rx="12" fill="#2563eb"/>
    <text x="710" y="231" fill="#ffffff">Probar y desplegar</text>
    <rect x="350" y="324" width="200" height="56" rx="12" fill="#2563eb" stroke="#f5a524" stroke-width="3"/>
    <text x="450" y="358" fill="#ffffff">Medir con DORA</text>
    <rect x="90" y="197" width="200" height="56" rx="12" fill="#2563eb"/>
    <text x="190" y="231" fill="#ffffff">Mejorar el proceso</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle" fill="#0b1b4d">
    <text x="450" y="218" font-size="20" font-weight="700">Mejora continua</text>
    <text x="450" y="246" font-size="16">con datos reales del pipeline</text>
  </g>
</svg>
