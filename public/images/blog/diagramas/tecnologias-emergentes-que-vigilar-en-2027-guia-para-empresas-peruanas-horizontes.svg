<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-label="Linea de tiempo con tres horizontes: ahora, 12 meses y 24 meses o mas, con tecnologias agrupadas en cada uno">
  <rect width="900" height="450" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0b1b4d">Tecnologías por horizonte de acción</text>

  <!-- Línea de tiempo -->
  <line x1="60" y1="110" x2="860" y2="110" stroke="#0b1b4d" stroke-width="4"/>
  <circle cx="180" cy="110" r="14" fill="#2563eb"/>
  <circle cx="460" cy="110" r="14" fill="#2563eb"/>
  <circle cx="740" cy="110" r="14" fill="#2563eb"/>

  <text x="180" y="82" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0b1b4d">Ahora</text>
  <text x="460" y="82" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0b1b4d">12 meses</text>
  <text x="740" y="82" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0b1b4d">24+ meses</text>

  <!-- Columna Ahora -->
  <rect x="60" y="150" width="240" height="60" rx="12" fill="#f3f6fb" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="186" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#0b1b4d">Seguridad de software</text>
  <rect x="60" y="230" width="240" height="60" rx="12" fill="#f3f6fb" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="266" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#0b1b4d">Wi-Fi 7 al renovar</text>
  <rect x="60" y="310" width="240" height="60" rx="12" fill="#f3f6fb" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="346" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#0b1b4d">Datos y regulación</text>

  <!-- Columna 12 meses -->
  <rect x="340" y="150" width="240" height="60" rx="12" fill="#f3f6fb" stroke="#2563eb" stroke-width="2"/>
  <text x="460" y="186" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#0b1b4d">IA agéntica en pilotos</text>
  <rect x="340" y="230" width="240" height="60" rx="12" fill="#f3f6fb" stroke="#2563eb" stroke-width="2"/>
  <text x="460" y="266" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#0b1b4d">Inventario poscuántico</text>
  <rect x="340" y="310" width="240" height="60" rx="12" fill="#f3f6fb" stroke="#2563eb" stroke-width="2"/>
  <text x="460" y="346" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#0b1b4d">Computación en el borde</text>

  <!-- Columna 24+ meses -->
  <rect x="620" y="150" width="240" height="60" rx="12" fill="#f3f6fb" stroke="#f5a524" stroke-width="2"/>
  <text x="740" y="186" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#0b1b4d">IA agéntica a escala</text>
  <rect x="620" y="230" width="240" height="60" rx="12" fill="#f3f6fb" stroke="#f5a524" stroke-width="2"/>
  <text x="740" y="266" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#0b1b4d">Migración poscuántica</text>
  <rect x="620" y="310" width="240" height="60" rx="12" fill="#f3f6fb" stroke="#f5a524" stroke-width="2"/>
  <text x="740" y="346" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#0b1b4d">5G privado en planta</text>

  <text x="450" y="415" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Horizontes orientativos según madurez y evidencia pública consultada.</text>
</svg>
