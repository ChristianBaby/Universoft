<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b1b4d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" fill="#ffffff"/>
  <!-- Arco de retorno -->
  <path d="M 770 150 C 770 40, 130 40, 130 150" fill="none" stroke="#0b1b4d" stroke-width="3" marker-end="url(#flecha)"/>
  <text x="450" y="62" text-anchor="middle" font-size="18" fill="#0b1b4d">Ajustar la hipótesis y repetir</text>
  <!-- Flechas entre cajas -->
  <line x1="320" y1="250" x2="375" y2="250" stroke="#0b1b4d" stroke-width="3" marker-end="url(#flecha)"/>
  <line x1="525" y1="250" x2="580" y2="250" stroke="#0b1b4d" stroke-width="3" marker-end="url(#flecha)"/>
  <!-- Cajas -->
  <rect x="60" y="180" width="260" height="140" rx="12" fill="#2563eb"/>
  <text x="190" y="235" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Construir</text>
  <text x="190" y="270" text-anchor="middle" font-size="16" fill="#ffffff">Experimento mínimo</text>
  <rect x="380" y="180" width="140" height="140" rx="12" fill="#0b1b4d"/>
  <text x="450" y="235" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Medir</text>
  <text x="450" y="270" text-anchor="middle" font-size="16" fill="#ffffff">Uso real</text>
  <rect x="585" y="180" width="260" height="140" rx="12" fill="#38a9f5"/>
  <text x="715" y="235" text-anchor="middle" font-size="22" font-weight="700" fill="#0b1b4d">Aprender</text>
  <text x="715" y="270" text-anchor="middle" font-size="16" fill="#0b1b4d">Seguir, cambiar o parar</text>
  <!-- Pie -->
  <text x="450" y="380" text-anchor="middle" font-size="18" fill="#0b1b4d">Cada ciclo responde una pregunta sobre el cliente</text>
</svg>
