<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b1b4d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" rx="12" fill="#ffffff"/>

  <!-- Capas principales -->
  <rect x="40" y="25" width="420" height="60" rx="12" fill="#0b1b4d"/>
  <text x="250" y="51" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Usuario</text>
  <text x="250" y="73" text-anchor="middle" font-size="16" fill="#ffffff">Empleado o cliente que hace la solicitud</text>

  <rect x="40" y="125" width="420" height="60" rx="12" fill="#2563eb"/>
  <text x="250" y="151" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Agente de IA</text>
  <text x="250" y="173" text-anchor="middle" font-size="16" fill="#ffffff">Interpreta, planifica y decide pasos</text>

  <rect x="40" y="225" width="420" height="60" rx="12" fill="#38a9f5"/>
  <text x="250" y="251" text-anchor="middle" font-size="17" font-weight="bold" fill="#0b1b4d">Herramientas y APIs</text>
  <text x="250" y="273" text-anchor="middle" font-size="16" fill="#0b1b4d">Consultar, registrar y enviar datos</text>

  <rect x="40" y="325" width="420" height="60" rx="12" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <text x="250" y="351" text-anchor="middle" font-size="17" font-weight="bold" fill="#0b1b4d">Sistemas de la empresa</text>
  <text x="250" y="373" text-anchor="middle" font-size="16" fill="#0b1b4d">CRM, ERP, correo y bases de datos</text>

  <line x1="250" y1="85" x2="250" y2="125" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="250" y1="185" x2="250" y2="225" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="250" y1="285" x2="250" y2="325" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- Controles transversales -->
  <rect x="610" y="125" width="250" height="260" rx="12" fill="#fef3dc" stroke="#f5a524" stroke-width="3"/>
  <text x="735" y="162" text-anchor="middle" font-size="18" font-weight="bold" fill="#0b1b4d">Controles</text>
  <text x="735" y="200" text-anchor="middle" font-size="16" fill="#0b1b4d">Permisos mínimos</text>
  <text x="735" y="235" text-anchor="middle" font-size="16" fill="#0b1b4d">Registro de acciones</text>
  <text x="735" y="270" text-anchor="middle" font-size="16" fill="#0b1b4d">Filtros de seguridad</text>
  <text x="735" y="305" text-anchor="middle" font-size="16" fill="#0b1b4d">Aprobación humana</text>
  <text x="735" y="340" text-anchor="middle" font-size="16" fill="#0b1b4d">Corte de emergencia</text>

  <line x1="610" y1="255" x2="470" y2="255" stroke="#f5a524" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="450" y="420" text-anchor="middle" font-size="16" fill="#0b1b4d">Los controles aplican a todas las capas que tocan datos reales.</text>
</svg>
