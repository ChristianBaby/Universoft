<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="t1 d1">
  <title id="t1">Ciclo de las seis funciones del NIST CSF 2.0</title>
  <desc id="d1">Seis funciones en ciclo: gobernar, identificar, proteger, detectar, responder y recuperar.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" fill="#ffffff"/>

  <g font-family="Inter, Arial, sans-serif" font-size="18" text-anchor="middle">
    <!-- Flechas del ciclo -->
    <g stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#flecha)">
      <line x1="550" y1="50" x2="615" y2="125"/>
      <line x1="720" y1="175" x2="720" y2="270"/>
      <line x1="615" y1="320" x2="550" y2="385"/>
      <line x1="350" y1="385" x2="285" y2="320"/>
      <line x1="180" y1="270" x2="180" y2="175"/>
      <line x1="285" y1="125" x2="350" y2="50"/>
    </g>

    <!-- Centro -->
    <circle cx="450" cy="225" r="80" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
    <text x="450" y="220" fill="#0b1b4d" font-size="18" font-weight="bold">Ciclo de</text>
    <text x="450" y="244" fill="#0b1b4d" font-size="18" font-weight="bold">gestión del riesgo</text>

    <!-- Cajas -->
    <rect x="350" y="20" width="200" height="60" rx="12" fill="#0b1b4d"/>
    <text x="450" y="57" fill="#ffffff">Gobernar</text>

    <rect x="620" y="110" width="200" height="60" rx="12" fill="#2563eb"/>
    <text x="720" y="147" fill="#ffffff">Identificar</text>

    <rect x="620" y="275" width="200" height="60" rx="12" fill="#2563eb"/>
    <text x="720" y="312" fill="#ffffff">Proteger</text>

    <rect x="350" y="370" width="200" height="60" rx="12" fill="#0b1b4d"/>
    <text x="450" y="407" fill="#ffffff">Detectar</text>

    <rect x="80" y="275" width="200" height="60" rx="12" fill="#2563eb"/>
    <text x="180" y="312" fill="#ffffff">Responder</text>

    <rect x="80" y="110" width="200" height="60" rx="12" fill="#2563eb"/>
    <text x="180" y="147" fill="#ffffff">Recuperar</text>
  </g>
</svg>
