<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="flecha" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b1b4d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" rx="12" fill="#ffffff"/>

  <!-- Fila 1 -->
  <rect x="40" y="60" width="240" height="96" rx="12" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <text x="160" y="100" text-anchor="middle" font-size="18" font-weight="bold" fill="#0b1b4d">1. Pregunta</text>
  <text x="160" y="124" text-anchor="middle" font-size="16" fill="#0b1b4d">del usuario</text>

  <rect x="330" y="60" width="240" height="96" rx="12" fill="#2563eb"/>
  <text x="450" y="100" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">2. Buscar en documentos</text>
  <text x="450" y="124" text-anchor="middle" font-size="16" fill="#ffffff">solo lo permitido</text>

  <rect x="620" y="60" width="240" height="96" rx="12" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <text x="740" y="100" text-anchor="middle" font-size="18" font-weight="bold" fill="#0b1b4d">3. Elegir fragmentos</text>
  <text x="740" y="124" text-anchor="middle" font-size="16" fill="#0b1b4d">más relevantes</text>

  <line x1="280" y1="108" x2="330" y2="108" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="570" y1="108" x2="620" y2="108" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- Bajada -->
  <line x1="740" y1="156" x2="740" y2="260" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- Fila 2 (de derecha a izquierda) -->
  <rect x="620" y="260" width="240" height="96" rx="12" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <text x="740" y="300" text-anchor="middle" font-size="18" font-weight="bold" fill="#0b1b4d">4. Armar instrucción</text>
  <text x="740" y="324" text-anchor="middle" font-size="16" fill="#0b1b4d">con el contexto</text>

  <rect x="330" y="260" width="240" height="96" rx="12" fill="#0b1b4d"/>
  <text x="450" y="300" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">5. El modelo redacta</text>
  <text x="450" y="324" text-anchor="middle" font-size="16" fill="#ffffff">la respuesta</text>

  <rect x="40" y="260" width="240" height="96" rx="12" fill="#f5a524"/>
  <text x="160" y="300" text-anchor="middle" font-size="18" font-weight="bold" fill="#0b1b4d">6. Respuesta con</text>
  <text x="160" y="324" text-anchor="middle" font-size="16" fill="#0b1b4d">fuentes citadas</text>

  <line x1="620" y1="308" x2="570" y2="308" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="330" y1="308" x2="280" y2="308" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- Nota -->
  <rect x="40" y="385" width="820" height="44" rx="12" fill="#f3f6fb"/>
  <text x="450" y="412" text-anchor="middle" font-size="16" fill="#0b1b4d">Los fragmentos recuperados son el contexto; la respuesta debe indicar de dónde sale.</text>
</svg>
