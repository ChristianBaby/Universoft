<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="t1 d1">
  <title id="t1">Flujo de verificación de un correo entrante</title>
  <desc id="d1">Un correo entrante pasa por tres comprobaciones: SPF, DKIM y DMARC. Según la política DMARC del dominio, el resultado puede ser entregar, enviar a spam o rechazar.</desc>
  <defs>
    <marker id="flecha" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b1b4d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" fill="#ffffff"/>
  <text x="450" y="50" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0b1b4d">Verificación de un correo entrante</text>

  <rect x="30" y="110" width="170" height="110" rx="12" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <text x="115" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0b1b4d">Correo llega</text>
  <text x="115" y="178" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">con dominio remitente</text>

  <rect x="260" y="110" width="170" height="110" rx="12" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
  <text x="345" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">SPF</text>
  <text x="345" y="178" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffffff">¿IP autorizada?</text>

  <rect x="490" y="110" width="170" height="110" rx="12" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
  <text x="575" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">DKIM</text>
  <text x="575" y="178" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffffff">¿firma válida?</text>

  <rect x="720" y="110" width="170" height="110" rx="12" fill="#0b1b4d" stroke="#f5a524" stroke-width="4"/>
  <text x="805" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">DMARC</text>
  <text x="805" y="178" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffffff">¿dominio alineado?</text>

  <line x1="200" y1="165" x2="260" y2="165" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="430" y1="165" x2="490" y2="165" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="660" y1="165" x2="720" y2="165" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>

  <path d="M805,220 V275 H745 V320" fill="none" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>
  <path d="M745,275 H450 V320" fill="none" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>
  <path d="M450,275 H155 V320" fill="none" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>

  <rect x="30" y="320" width="250" height="90" rx="12" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <text x="155" y="352" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0b1b4d">p=none</text>
  <text x="155" y="380" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Entrega y reporta</text>

  <rect x="325" y="320" width="250" height="90" rx="12" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <text x="450" y="352" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0b1b4d">p=quarantine</text>
  <text x="450" y="380" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Se envía a spam</text>

  <rect x="620" y="320" width="250" height="90" rx="12" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <text x="745" y="352" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0b1b4d">p=reject</text>
  <text x="745" y="380" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Se rechaza</text>
</svg>
