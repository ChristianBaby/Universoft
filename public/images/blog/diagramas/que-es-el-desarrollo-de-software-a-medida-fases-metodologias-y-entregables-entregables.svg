<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="tEnt dEnt">
  <title id="tEnt">Qué entrega cada fase del desarrollo a medida</title>
  <desc id="dEnt">Lista de seis fases, cada una conectada por una flecha a su entregable: documento de requisitos, prototipos y arquitectura, código fuente, informe de pruebas, manual y accesos, y plan de soporte.</desc>
  <defs>
    <marker id="flechaEnt" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" rx="12" fill="#ffffff"/>
  <text x="40" y="45" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b1b4d">Qué entrega cada fase</text>

  <rect x="40" y="75" width="250" height="46" rx="12" fill="#0b1b4d"/>
  <text x="165" y="104" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">1. Descubrimiento</text>
  <line x1="290" y1="98" x2="372" y2="98" stroke="#2563eb" stroke-width="2" marker-end="url(#flechaEnt)"/>
  <rect x="380" y="75" width="480" height="46" rx="12" fill="#f3f6fb" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="104" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Documento de requisitos y alcance</text>

  <rect x="40" y="135" width="250" height="46" rx="12" fill="#0b1b4d"/>
  <text x="165" y="164" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">2. Diseño</text>
  <line x1="290" y1="158" x2="372" y2="158" stroke="#2563eb" stroke-width="2" marker-end="url(#flechaEnt)"/>
  <rect x="380" y="135" width="480" height="46" rx="12" fill="#f3f6fb" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="164" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Prototipos y arquitectura técnica</text>

  <rect x="40" y="195" width="250" height="46" rx="12" fill="#0b1b4d"/>
  <text x="165" y="224" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">3. Desarrollo</text>
  <line x1="290" y1="218" x2="372" y2="218" stroke="#2563eb" stroke-width="2" marker-end="url(#flechaEnt)"/>
  <rect x="380" y="195" width="480" height="46" rx="12" fill="#f3f6fb" stroke="#f5a524" stroke-width="3"/>
  <text x="620" y="224" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b1b4d">Código fuente y versiones controladas</text>

  <rect x="40" y="255" width="250" height="46" rx="12" fill="#0b1b4d"/>
  <text x="165" y="284" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">4. Pruebas</text>
  <line x1="290" y1="278" x2="372" y2="278" stroke="#2563eb" stroke-width="2" marker-end="url(#flechaEnt)"/>
  <rect x="380" y="255" width="480" height="46" rx="12" fill="#f3f6fb" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="284" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Informe de pruebas y errores corregidos</text>

  <rect x="40" y="315" width="250" height="46" rx="12" fill="#0b1b4d"/>
  <text x="165" y="344" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">5. Despliegue</text>
  <line x1="290" y1="338" x2="372" y2="338" stroke="#2563eb" stroke-width="2" marker-end="url(#flechaEnt)"/>
  <rect x="380" y="315" width="480" height="46" rx="12" fill="#f3f6fb" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="344" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Manual y accesos de producción</text>

  <rect x="40" y="375" width="250" height="46" rx="12" fill="#0b1b4d"/>
  <text x="165" y="404" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">6. Soporte</text>
  <line x1="290" y1="398" x2="372" y2="398" stroke="#2563eb" stroke-width="2" marker-end="url(#flechaEnt)"/>
  <rect x="380" y="375" width="480" height="46" rx="12" fill="#f3f6fb" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="404" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Plan de soporte y mantenimiento</text>
</svg>
