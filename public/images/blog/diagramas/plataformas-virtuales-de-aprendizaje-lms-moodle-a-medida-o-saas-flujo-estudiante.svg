<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="t2 d2" font-family="Inter, Arial, sans-serif">
  <title id="t2">Flujo del estudiante en un LMS</title>
  <desc id="d2">Cuatro pasos en secuencia: matrícula, estudio, evaluación y certificado. Si la evaluación no se aprueba, el estudiante vuelve al estudio.</desc>
  <defs>
    <marker id="arr-a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b1b4d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" fill="#ffffff"/>
  <g fill="#f3f6fb" stroke="#2563eb" stroke-width="2">
    <rect x="30" y="150" width="160" height="90" rx="12"/>
    <rect x="250" y="150" width="160" height="90" rx="12"/>
    <rect x="470" y="150" width="160" height="90" rx="12"/>
    <rect x="690" y="150" width="160" height="90" rx="12" stroke="#f5a524" stroke-width="3"/>
  </g>
  <g stroke="#0b1b4d" stroke-width="2.5" marker-end="url(#arr-a)">
    <line x1="190" y1="195" x2="250" y2="195"/>
    <line x1="410" y1="195" x2="470" y2="195"/>
    <line x1="630" y1="195" x2="690" y2="195"/>
  </g>
  <path d="M550,240 L550,330 L330,330 L330,240" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arr-a)"/>
  <g fill="#0b1b4d" text-anchor="middle">
    <text x="110" y="190" font-size="18" font-weight="700">1. Matrícula</text>
    <text x="110" y="218" font-size="16">Acceso al curso</text>
    <text x="330" y="190" font-size="18" font-weight="700">2. Estudio</text>
    <text x="330" y="218" font-size="16">Lecciones y recursos</text>
    <text x="550" y="190" font-size="18" font-weight="700">3. Evaluación</text>
    <text x="550" y="218" font-size="16">Aprobado o no</text>
    <text x="770" y="190" font-size="18" font-weight="700">4. Certificado</text>
    <text x="770" y="218" font-size="16">Descarga o código</text>
    <text x="660" y="136" font-size="16" font-weight="600">Aprobó</text>
    <text x="440" y="368" font-size="16">No aprobó: vuelve a estudiar</text>
  </g>
</svg>
