<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b1b4d"/>
    </marker>
    <marker id="flechaAmbar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f5a524"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" rx="12" fill="#ffffff"/>

  <!-- Ciclo superior -->
  <path d="M 760 110 L 760 72 L 130 72 L 130 110" fill="none" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>

  <rect x="40" y="110" width="180" height="70" rx="12" fill="#f3f6fb" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="140" text-anchor="middle" font-size="17" font-weight="bold" fill="#0b1b4d">1. Percibir</text>
  <text x="130" y="163" text-anchor="middle" font-size="16" fill="#0b1b4d">Recibe el pedido</text>

  <rect x="250" y="110" width="180" height="70" rx="12" fill="#f3f6fb" stroke="#2563eb" stroke-width="2"/>
  <text x="340" y="140" text-anchor="middle" font-size="17" font-weight="bold" fill="#0b1b4d">2. Razonar</text>
  <text x="340" y="163" text-anchor="middle" font-size="16" fill="#0b1b4d">Planifica los pasos</text>

  <rect x="460" y="110" width="180" height="70" rx="12" fill="#f3f6fb" stroke="#2563eb" stroke-width="2"/>
  <text x="550" y="140" text-anchor="middle" font-size="17" font-weight="bold" fill="#0b1b4d">3. Actuar</text>
  <text x="550" y="163" text-anchor="middle" font-size="16" fill="#0b1b4d">Usa herramientas</text>

  <rect x="670" y="110" width="180" height="70" rx="12" fill="#f3f6fb" stroke="#2563eb" stroke-width="2"/>
  <text x="760" y="140" text-anchor="middle" font-size="17" font-weight="bold" fill="#0b1b4d">4. Observar</text>
  <text x="760" y="163" text-anchor="middle" font-size="16" fill="#0b1b4d">Revisa el resultado</text>

  <line x1="220" y1="145" x2="250" y2="145" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="430" y1="145" x2="460" y2="145" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="640" y1="145" x2="670" y2="145" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- Supervision humana -->
  <line x1="520" y1="180" x2="520" y2="290" stroke="#f5a524" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#flechaAmbar)"/>
  <line x1="580" y1="290" x2="580" y2="180" stroke="#f5a524" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#flechaAmbar)"/>
  <text x="500" y="236" text-anchor="end" font-size="16" fill="#0b1b4d">Acción de riesgo</text>
  <text x="600" y="236" text-anchor="start" font-size="16" fill="#0b1b4d">Aprueba o corrige</text>

  <rect x="260" y="290" width="380" height="80" rx="12" fill="#fef3dc" stroke="#f5a524" stroke-width="3"/>
  <text x="450" y="322" text-anchor="middle" font-size="18" font-weight="bold" fill="#0b1b4d">Supervisión humana</text>
  <text x="450" y="348" text-anchor="middle" font-size="16" fill="#0b1b4d">Decide antes de ejecutar</text>

  <text x="450" y="415" text-anchor="middle" font-size="16" fill="#0b1b4d">El ciclo se repite hasta completar la tarea o pedir ayuda.</text>
</svg>
