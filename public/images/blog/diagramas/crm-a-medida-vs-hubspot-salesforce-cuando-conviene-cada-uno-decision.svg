<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="titulo descripcion" font-family="Inter, Arial, sans-serif">
  <title id="titulo">Ruta de decisión entre CRM genérico y CRM a medida</title>
  <desc id="descripcion">Si el proceso de ventas es estándar, se elige un CRM genérico. Si no lo es, se pregunta si hay que integrar sistemas propios o si el costo por usuario sube mucho; en esos casos conviene evaluar un CRM a medida.</desc>
  <defs>
    <marker id="flecha" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b1b4d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" rx="12" fill="#ffffff"/>

  <!-- Flechas -->
  <g stroke="#0b1b4d" stroke-width="2" fill="none" marker-end="url(#flecha)">
    <line x1="190" y1="220" x2="226" y2="220"/>
    <line x1="320" y1="183" x2="320" y2="112"/>
    <line x1="410" y1="220" x2="456" y2="220"/>
    <line x1="550" y1="183" x2="550" y2="112"/>
    <line x1="550" y1="255" x2="550" y2="326"/>
    <line x1="460" y1="365" x2="414" y2="365"/>
    <line x1="640" y1="365" x2="686" y2="365"/>
  </g>

  <!-- Inicio -->
  <rect x="30" y="185" width="160" height="70" rx="12" fill="#0b1b4d"/>
  <text x="110" y="216" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Tu proceso</text>
  <text x="110" y="240" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">de ventas</text>

  <!-- Preguntas -->
  <g fill="#f3f6fb" stroke="#2563eb" stroke-width="2">
    <rect x="230" y="185" width="180" height="70" rx="12"/>
    <rect x="460" y="185" width="180" height="70" rx="12"/>
    <rect x="460" y="330" width="180" height="70" rx="12"/>
  </g>
  <text x="320" y="216" text-anchor="middle" font-size="16" font-weight="600" fill="#0b1b4d">¿Proceso</text>
  <text x="320" y="240" text-anchor="middle" font-size="16" font-weight="600" fill="#0b1b4d">estándar?</text>
  <text x="550" y="216" text-anchor="middle" font-size="16" font-weight="600" fill="#0b1b4d">¿Integra sistemas</text>
  <text x="550" y="240" text-anchor="middle" font-size="16" font-weight="600" fill="#0b1b4d">propios?</text>
  <text x="550" y="361" text-anchor="middle" font-size="16" font-weight="600" fill="#0b1b4d">¿Costo por usuario</text>
  <text x="550" y="385" text-anchor="middle" font-size="16" font-weight="600" fill="#0b1b4d">sube mucho?</text>

  <!-- Resultados -->
  <g fill="#2563eb">
    <rect x="230" y="40" width="180" height="70" rx="12"/>
    <rect x="230" y="330" width="180" height="70" rx="12"/>
  </g>
  <text x="320" y="81" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">CRM genérico</text>
  <text x="320" y="371" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">CRM genérico</text>

  <g fill="#f5a524">
    <rect x="460" y="40" width="180" height="70" rx="12"/>
    <rect x="690" y="330" width="180" height="70" rx="12"/>
  </g>
  <text x="550" y="81" text-anchor="middle" font-size="18" font-weight="700" fill="#0b1b4d">Evaluar a medida</text>
  <text x="780" y="371" text-anchor="middle" font-size="18" font-weight="700" fill="#0b1b4d">Evaluar a medida</text>

  <!-- Etiquetas -->
  <g font-size="16" font-weight="700" fill="#0b1b4d">
    <text x="332" y="150">Sí</text>
    <text x="422" y="212">No</text>
    <text x="562" y="150">Sí</text>
    <text x="562" y="296">No</text>
    <text x="424" y="358">No</text>
    <text x="650" y="358">Sí</text>
  </g>
</svg>
