<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="t1 d1">
  <title id="t1">Flujo de acceso Zero Trust</title>
  <desc id="d1">Usuario pasa por verificación de identidad y dispositivo, luego por una política de acceso, y finalmente llega al recurso. Un monitoreo continuo corre debajo de todo el flujo.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b1b4d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" fill="#ffffff"/>

  <!-- Caja 1: Usuario -->
  <rect x="30" y="140" width="180" height="140" rx="12" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <text x="120" y="200" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold" fill="#0b1b4d">Usuario</text>
  <text x="120" y="228" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">solicita acceso</text>

  <!-- Caja 2: Verificación (resaltada) -->
  <rect x="250" y="140" width="180" height="140" rx="12" fill="#2563eb" stroke="#0b1b4d" stroke-width="2"/>
  <text x="340" y="190" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Verificación</text>
  <text x="340" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffffff">de identidad y</text>
  <text x="340" y="238" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffffff">dispositivo</text>

  <!-- Caja 3: Política -->
  <rect x="470" y="140" width="180" height="140" rx="12" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <text x="560" y="200" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold" fill="#0b1b4d">Política</text>
  <text x="560" y="228" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">permite o bloquea</text>

  <!-- Caja 4: Recurso -->
  <rect x="690" y="140" width="180" height="140" rx="12" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <text x="780" y="200" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold" fill="#0b1b4d">Recurso</text>
  <text x="780" y="228" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">aplicación o dato</text>

  <!-- Flechas -->
  <line x1="212" y1="210" x2="246" y2="210" stroke="#0b1b4d" stroke-width="2.5" marker-end="url(#flecha)"/>
  <line x1="432" y1="210" x2="466" y2="210" stroke="#0b1b4d" stroke-width="2.5" marker-end="url(#flecha)"/>
  <line x1="652" y1="210" x2="686" y2="210" stroke="#0b1b4d" stroke-width="2.5" marker-end="url(#flecha)"/>

  <!-- Monitoreo continuo -->
  <rect x="30" y="330" width="840" height="64" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="450" y="368" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold" fill="#0b1b4d">Monitoreo continuo: cada solicitud se evalúa de nuevo</text>
</svg>
