<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="tCapas dCapas">
  <title id="tCapas">Quién gestiona cada capa en IaaS, PaaS y SaaS</title>
  <desc id="dCapas">Tabla por capas: en IaaS el cliente gestiona aplicaciones, sistema operativo y red; en PaaS comparte aplicaciones y red; en SaaS comparte aplicaciones y el proveedor gestiona la mayor parte. Datos e identidades siempre son del cliente.</desc>
  <rect x="0" y="0" width="900" height="460" rx="12" fill="#ffffff"/>
  <text x="40" y="40" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#0b1b4d">Quién gestiona cada capa</text>
  <text x="410" y="96" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b1b4d">IaaS</text>
  <text x="600" y="96" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b1b4d">PaaS</text>
  <text x="790" y="96" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b1b4d">SaaS</text>

  <text x="40" y="144" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0b1b4d">Datos e identidades</text>
  <rect x="320" y="112" width="180" height="52" rx="12" fill="#2563eb"/>
  <text x="410" y="144" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#ffffff">Cliente</text>
  <rect x="510" y="112" width="180" height="52" rx="12" fill="#2563eb"/>
  <text x="600" y="144" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#ffffff">Cliente</text>
  <rect x="700" y="112" width="180" height="52" rx="12" fill="#2563eb"/>
  <text x="790" y="144" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#ffffff">Cliente</text>

  <text x="40" y="208" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0b1b4d">Aplicaciones</text>
  <rect x="320" y="176" width="180" height="52" rx="12" fill="#2563eb"/>
  <text x="410" y="208" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#ffffff">Cliente</text>
  <rect x="510" y="176" width="180" height="52" rx="12" fill="#38a9f5"/>
  <text x="600" y="208" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0b1b4d">Compartido</text>
  <rect x="700" y="176" width="180" height="52" rx="12" fill="#38a9f5"/>
  <text x="790" y="208" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0b1b4d">Compartido</text>

  <text x="40" y="272" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0b1b4d">Sistema operativo</text>
  <rect x="320" y="240" width="180" height="52" rx="12" fill="#2563eb"/>
  <text x="410" y="272" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#ffffff">Cliente</text>
  <rect x="510" y="240" width="180" height="52" rx="12" fill="#f3f6fb" stroke="#b8c4d9"/>
  <text x="600" y="272" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0b1b4d">Proveedor</text>
  <rect x="700" y="240" width="180" height="52" rx="12" fill="#f3f6fb" stroke="#b8c4d9"/>
  <text x="790" y="272" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0b1b4d">Proveedor</text>

  <text x="40" y="336" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0b1b4d">Controles de red</text>
  <rect x="320" y="304" width="180" height="52" rx="12" fill="#2563eb"/>
  <text x="410" y="336" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#ffffff">Cliente</text>
  <rect x="510" y="304" width="180" height="52" rx="12" fill="#38a9f5"/>
  <text x="600" y="336" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0b1b4d">Compartido</text>
  <rect x="700" y="304" width="180" height="52" rx="12" fill="#f3f6fb" stroke="#b8c4d9"/>
  <text x="790" y="336" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0b1b4d">Proveedor</text>

  <text x="40" y="400" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0b1b4d">Centro de datos y hosts</text>
  <rect x="320" y="368" width="180" height="52" rx="12" fill="#f3f6fb" stroke="#b8c4d9"/>
  <text x="410" y="400" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0b1b4d">Proveedor</text>
  <rect x="510" y="368" width="180" height="52" rx="12" fill="#f3f6fb" stroke="#b8c4d9"/>
  <text x="600" y="400" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0b1b4d">Proveedor</text>
  <rect x="700" y="368" width="180" height="52" rx="12" fill="#f3f6fb" stroke="#b8c4d9"/>
  <text x="790" y="400" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0b1b4d">Proveedor</text>

  <rect x="40" y="436" width="20" height="16" rx="4" fill="#2563eb"/>
  <text x="68" y="450" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Cliente</text>
  <rect x="200" y="436" width="20" height="16" rx="4" fill="#38a9f5"/>
  <text x="228" y="450" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Compartido</text>
  <rect x="380" y="436" width="20" height="16" rx="4" fill="#f3f6fb" stroke="#b8c4d9"/>
  <text x="408" y="450" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Proveedor</text>
</svg>
