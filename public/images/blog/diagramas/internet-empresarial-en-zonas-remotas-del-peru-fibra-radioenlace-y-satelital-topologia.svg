<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="t3 d3" font-family="Inter, Arial, sans-serif">
  <title id="t3">Topología con enlace principal y respaldo</title>
  <desc id="d3">Una sede remota se conecta con la sede central y la nube por un enlace principal de fibra, y por un respaldo de radioenlace o satelital con conmutación automática.</desc>
  <rect x="0" y="0" width="900" height="450" fill="#ffffff"/>
  <g fill="none" stroke="#0b1b4d" stroke-width="3">
    <path d="M220,200 L285,200 L285,95 L350,95"/>
    <path d="M550,95 L735,95 L735,165"/>
  </g>
  <g fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="10 7">
    <path d="M220,250 L285,250 L285,355 L350,355"/>
    <path d="M550,355 L735,355 L735,285"/>
  </g>
  <g fill="#f3f6fb" stroke="#2563eb" stroke-width="2">
    <rect x="350" y="60" width="200" height="70" rx="12"/>
    <rect x="350" y="320" width="200" height="70" rx="12"/>
  </g>
  <rect x="30" y="165" width="190" height="120" rx="12" fill="#0b1b4d"/>
  <rect x="680" y="165" width="190" height="120" rx="12" fill="#f3f6fb" stroke="#2563eb" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="125" y="212" fill="#ffffff" font-size="20" font-weight="700">Sede remota</text>
    <text x="125" y="242" fill="#ffffff" font-size="16">Equipo de borde</text>
    <text x="450" y="90" fill="#0b1b4d" font-size="18" font-weight="700">Enlace principal</text>
    <text x="450" y="116" fill="#0b1b4d" font-size="16">Fibra óptica</text>
    <text x="450" y="350" fill="#0b1b4d" font-size="18" font-weight="700">Respaldo</text>
    <text x="450" y="376" fill="#0b1b4d" font-size="16">Radioenlace o satelital</text>
    <text x="775" y="212" fill="#0b1b4d" font-size="20" font-weight="700">Sede central</text>
    <text x="775" y="242" fill="#0b1b4d" font-size="16">Nube y sistemas</text>
    <text x="450" y="228" fill="#0b1b4d" font-size="16">Si cae la fibra,</text>
    <text x="450" y="250" fill="#0b1b4d" font-size="16">el tráfico pasa al respaldo</text>
    <text x="450" y="425" fill="#0b1b4d" font-size="16">Línea continua: enlace principal. Línea discontinua: respaldo.</text>
  </g>
</svg>
