<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Flujo para decidir entre ERP genérico y desarrollo a medida</title>
  <desc id="descripcion">Si los procesos son estándar, conviene un ERP genérico. Si son una ventaja propia, conviene evaluar un desarrollo a medida.</desc>
  <defs>
    <marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b1b4d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" fill="#ffffff"/>
  <text x="450" y="45" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#0b1b4d">Cómo decidir entre ERP genérico y a medida</text>

  <rect x="340" y="75" width="220" height="60" rx="12" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <text x="450" y="112" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b1b4d">¿Tus procesos son estándar?</text>

  <rect x="100" y="210" width="240" height="75" rx="12" fill="#f3f6fb" stroke="#38a9f5" stroke-width="3"/>
  <text x="220" y="243" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b1b4d">Sí: ERP genérico</text>
  <text x="220" y="270" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Empieza con módulos estándar</text>

  <rect x="540" y="210" width="240" height="75" rx="12" fill="#f3f6fb" stroke="#38a9f5" stroke-width="3"/>
  <text x="660" y="243" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b1b4d">No: evalúa a medida</text>
  <text x="660" y="270" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Procesos son tu ventaja</text>

  <rect x="540" y="330" width="240" height="75" rx="12" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
  <text x="660" y="363" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Desarrollo a medida</text>
  <text x="660" y="390" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffffff">Reglas e integraciones propias</text>

  <line x1="400" y1="135" x2="250" y2="210" stroke="#0b1b4d" stroke-width="3" marker-end="url(#flecha)"/>
  <text x="300" y="168" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b1b4d">Sí</text>
  <line x1="500" y1="135" x2="630" y2="210" stroke="#0b1b4d" stroke-width="3" marker-end="url(#flecha)"/>
  <text x="600" y="168" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b1b4d">No</text>
  <line x1="660" y1="285" x2="660" y2="330" stroke="#0b1b4d" stroke-width="3" marker-end="url(#flecha)"/>
  <text x="700" y="312" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#f5a524">Revisa costo total</text>

  <text x="220" y="390" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Confirma también costo total</text>
  <text x="220" y="412" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">y capacidad de adopción</text>
</svg>
