<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="tCic dCic">
  <title id="tCic">Ciclo de mejora de procesos</title>
  <desc id="dCic">Cuatro pasos en círculo: medir el estado actual, analizar los cuellos de botella, diseñar el estado futuro e implementar la automatización. Al final se revisan los indicadores y el ciclo se repite.</desc>
  <defs>
    <marker id="arCic" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b1b4d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" rx="12" fill="#ffffff"/>

  <rect x="190" y="85" width="220" height="70" rx="12" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <text x="300" y="115" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Medir</text>
  <text x="300" y="137" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">estado actual (AS-IS)</text>

  <rect x="490" y="85" width="220" height="70" rx="12" fill="#38a9f5"/>
  <text x="600" y="115" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Analizar</text>
  <text x="600" y="137" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">cuellos de botella</text>

  <rect x="490" y="295" width="220" height="70" rx="12" fill="#2563eb"/>
  <text x="600" y="325" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffffff">Diseñar</text>
  <text x="600" y="347" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffffff">estado futuro (TO-BE)</text>

  <rect x="190" y="295" width="220" height="70" rx="12" fill="#0b1b4d"/>
  <text x="300" y="325" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffffff">Implementar</text>
  <text x="300" y="347" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffffff">y automatizar</text>

  <path d="M410,120 L486,120" stroke="#0b1b4d" stroke-width="2" fill="none" marker-end="url(#arCic)"/>
  <path d="M600,157 L600,291" stroke="#0b1b4d" stroke-width="2" fill="none" marker-end="url(#arCic)"/>
  <path d="M486,330 L414,330" stroke="#0b1b4d" stroke-width="2" fill="none" marker-end="url(#arCic)"/>
  <path d="M300,291 L300,159" stroke="#0b1b4d" stroke-width="2" fill="none" marker-end="url(#arCic)"/>

  <text x="450" y="212" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Mejora continua</text>
  <text x="450" y="236" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">(revisar indicadores)</text>
  <text x="450" y="415" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0b1b4d">Al terminar, se vuelve a medir y el ciclo se repite.</text>
</svg>
