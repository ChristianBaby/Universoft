<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="flecha" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b1b4d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" rx="12" fill="#ffffff"/>

  <!-- Sistemas de origen -->
  <rect x="60" y="40" width="220" height="60" rx="12" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <text x="170" y="76" text-anchor="middle" font-size="18" fill="#0b1b4d">ERP y facturación</text>
  <rect x="340" y="40" width="220" height="60" rx="12" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <text x="450" y="76" text-anchor="middle" font-size="18" fill="#0b1b4d">Reservas y ventas</text>
  <rect x="620" y="40" width="220" height="60" rx="12" fill="#f3f6fb" stroke="#0b1b4d" stroke-width="2"/>
  <text x="730" y="76" text-anchor="middle" font-size="18" fill="#0b1b4d">CRM y atención</text>

  <!-- Flechas origen -> integración -->
  <line x1="170" y1="100" x2="260" y2="150" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="450" y1="100" x2="450" y2="150" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="730" y1="100" x2="640" y2="150" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- Integración -->
  <rect x="200" y="150" width="500" height="56" rx="12" fill="#2563eb"/>
  <text x="450" y="184" text-anchor="middle" font-size="18" fill="#ffffff">Ingesta e integración de datos</text>

  <!-- Flecha integración -> lake -->
  <line x1="300" y1="206" x2="160" y2="250" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- Data lake -->
  <rect x="40" y="250" width="240" height="76" rx="12" fill="#38a9f5"/>
  <text x="160" y="282" text-anchor="middle" font-size="18" font-weight="bold" fill="#0b1b4d">Data lake</text>
  <text x="160" y="308" text-anchor="middle" font-size="16" fill="#0b1b4d">datos en bruto</text>

  <!-- Flecha lake -> warehouse -->
  <line x1="280" y1="288" x2="330" y2="288" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- Data warehouse -->
  <rect x="330" y="250" width="240" height="76" rx="12" fill="#0b1b4d" stroke="#f5a524" stroke-width="3"/>
  <text x="450" y="282" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Data warehouse</text>
  <text x="450" y="308" text-anchor="middle" font-size="16" fill="#ffffff">datos listos</text>

  <!-- Flecha warehouse -> dashboards -->
  <line x1="570" y1="288" x2="620" y2="288" stroke="#0b1b4d" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- Dashboards -->
  <rect x="620" y="250" width="240" height="76" rx="12" fill="#2563eb"/>
  <text x="740" y="282" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Dashboards</text>
  <text x="740" y="308" text-anchor="middle" font-size="16" fill="#ffffff">e informes</text>

  <!-- Gobierno -->
  <rect x="40" y="370" width="820" height="44" rx="12" fill="#f3f6fb" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="398" text-anchor="middle" font-size="18" fill="#0b1b4d">Gobierno, calidad de datos y seguridad</text>
</svg>
